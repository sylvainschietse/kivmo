name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kivmo
          POSTGRES_PASSWORD: kivmo
          POSTGRES_DB: kivmo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kivmo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kivmo:kivmo@localhost:5432/kivmo_test
      DATABASE_URL: postgres://kivmo:kivmo@localhost:5432/kivmo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
